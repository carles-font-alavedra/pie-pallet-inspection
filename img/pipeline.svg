<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family="Helvetica,Arial,sans-serif">
  <rect width="860" height="300" rx="10" fill="#ffffff"/>
  <text x="30" y="40" font-size="17" font-weight="700" fill="#1a1a1a">Pipeline de captura y medición — Intel RealSense D435i</text>
  <text x="30" y="62" font-size="12.5" fill="#6a6a6a">640×480 · depth z16 + color rgb8 · 30 fps</text>

  <g>
    <rect x="30" y="100" width="150" height="74" rx="8" fill="#eef2f7" stroke="#c6d2e0"/>
    <text x="105" y="127" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">connectDepth.m</text>
    <text x="105" y="146" font-size="11" text-anchor="middle" fill="#5a6572">configura pipeline</text>
    <text x="105" y="161" font-size="11" text-anchor="middle" fill="#5a6572">resolución y fps</text>
  </g>
  <path d="M184 137 L212 137" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="216" y="100" width="150" height="74" rx="8" fill="#eef2f7" stroke="#c6d2e0"/>
    <text x="291" y="127" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">depthCapture.m</text>
    <text x="291" y="146" font-size="11" text-anchor="middle" fill="#5a6572">captura frames</text>
    <text x="291" y="161" font-size="11" text-anchor="middle" fill="#5a6572">de profundidad</text>
  </g>
  <path d="M370 137 L398 137" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="402" y="100" width="150" height="74" rx="8" fill="#e8f0e9" stroke="#bdd3c0"/>
    <text x="477" y="127" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">scan2mascara.m</text>
    <text x="477" y="146" font-size="11" text-anchor="middle" fill="#5a6572">aísla el palet por</text>
    <text x="477" y="161" font-size="11" text-anchor="middle" fill="#5a6572">umbral de distancia</text>
  </g>
  <path d="M556 137 L584 137" stroke="#9aa7b5" stroke-width="1.6" marker-end="url(#a)"/>

  <g>
    <rect x="588" y="100" width="150" height="74" rx="8" fill="#f6eee6" stroke="#dfcbb6"/>
    <text x="663" y="127" font-size="13" font-weight="600" text-anchor="middle" fill="#1a1a1a">medición</text>
    <text x="663" y="146" font-size="11" text-anchor="middle" fill="#5a6572">mesures_rgb.m</text>
    <text x="663" y="161" font-size="11" text-anchor="middle" fill="#5a6572">mesure_depth_solution.m</text>
  </g>

  <g>
    <rect x="216" y="208" width="150" height="56" rx="8" fill="#fafafa" stroke="#dcdcdc" stroke-dasharray="4 3"/>
    <text x="291" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#4a4a4a">scan2images.m</text>
    <text x="291" y="250" font-size="10.5" text-anchor="middle" fill="#777">escaneo → imágenes</text>
  </g>
  <g>
    <rect x="402" y="208" width="150" height="56" rx="8" fill="#fafafa" stroke="#dcdcdc" stroke-dasharray="4 3"/>
    <text x="477" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#4a4a4a">video_mesura.m</text>
    <text x="477" y="250" font-size="10.5" text-anchor="middle" fill="#777">medición sobre vídeo</text>
  </g>
  <g>
    <rect x="588" y="208" width="150" height="56" rx="8" fill="#fafafa" stroke="#dcdcdc" stroke-dasharray="4 3"/>
    <text x="663" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#4a4a4a">janvideo.m</text>
    <text x="663" y="250" font-size="10.5" text-anchor="middle" fill="#777">reproducción</text>
  </g>
  <text x="30" y="240" font-size="11" fill="#8a8a8a">utilidades</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa7b5"/>
    </marker>
  </defs>
</svg>
